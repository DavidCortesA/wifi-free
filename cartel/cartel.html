<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Cartel WiFi Gratis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #fff; }
  body {
    width: 8.5in;
    height: 11in;
    font-family: 'Inter', system-ui, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page {
    height: 100%;
    padding: 0.55in 0.6in;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .page > * { flex-shrink: 0; }
  .wifi { width: 1.2in; height: 0.96in; margin-top: 0.1in; }
  .wifi path { fill: none; stroke: #000; stroke-width: 11; stroke-linecap: round; }
  h1 {
    margin-top: 0.12in;
    font-weight: 900;
    font-size: 0.98in;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: -0.03em;
  }
  .tag {
    margin-top: 0.22in;
    display: inline-block;
    padding: 0.08in 0.28in;
    background: #000;
    color: #fff;
    font-weight: 700;
    font-size: 0.36in;
    border-radius: 999px;
    letter-spacing: 0.01em;
  }
  .qr-wrap {
    position: relative;
    margin-top: 0.38in;
    padding: 0.26in;
    border: 0.07in solid #000;
    border-radius: 0.3in;
  }
  .qr-wrap svg { display: block; width: 3.85in; height: 3.85in; }
  .scan {
    position: absolute;
    left: 50%;
    bottom: -0.2in;
    translate: -50% 0;
    background: #fff;
    padding: 0 0.16in;
    font-weight: 900;
    font-size: 0.26in;
    letter-spacing: 0.18em;
    white-space: nowrap;
  }
  .details {
    margin-top: 0.45in;
    width: 5.2in;
    border: 0.025in dashed #000;
    border-radius: 0.16in;
    padding: 0.16in 0.3in;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.06in 0.2in;
    text-align: left;
    font-size: 0.22in;
  }
  .details dt { font-weight: 500; color: #333; }
  .details dd { font-weight: 700; text-align: right; }
  .foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 0.12in;
    font-size: 0.19in;
    font-weight: 500;
  }
  .foot svg { width: 0.28in; height: 0.28in; }
</style>
</head>
<body>
